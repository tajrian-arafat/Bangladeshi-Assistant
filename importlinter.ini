[importlinter]
root_packages =
    app

[importlinter:contract:api-layer]
name = API layer must not import ingestion or workers directly
type = forbidden
source_modules =
    app.api
forbidden_modules =
    app.ingestion
    app.workers

[importlinter:contract:application-layer]
name = Application layer must not import AI LLM or scrapy
type = forbidden
source_modules =
    app.application
forbidden_modules =
    app.ai.llm_client
    scrapy

[importlinter:contract:domain-purity]
name = Domain layer must not import API or application
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.api
    app.application

[importlinter:contract:ai-layer]
name = AI layer must not import API
type = forbidden
source_modules =
    app.ai
forbidden_modules =
    app.api
    scrapy
